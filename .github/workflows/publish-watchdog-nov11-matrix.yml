name: Publish Watchdog Nov 11 matrix update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move watchdog.html to index.html and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f watchdog.html index.html
          rm -f .github/workflows/publish-watchdog-nov11-matrix.yml
          git add -A
          git commit -m "Publish Watchdog Nov 11 matrix update"
          git push
