name: Publish Nov 18 decision matrix
on:
  push:
    paths:
      - '.github/workflows/publish-2026-11-18b.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename watchdog.html to index.html and commit
        run: |
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git mv -f watchdog.html index.html
          git commit -m "Publish Watchdog November 18, 2026 edition (decision matrix update)"
          git push
