name: Publish Watchdog 2026-11-27

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move watchdog.html to index.html and publish
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f watchdog.html index.html
          echo "9adab77804e8d4dc0d3bcf4e69da2d85  index.html" | md5sum -c -
          ls -l index.html
          git add index.html
          git commit -m "Watchdog Nov 27, 2026"
          git push
