name: Publish Nov 8 audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nov8-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded Nov 8 MP3
        run: git mv -f audio/watchdog-news-november-8-2026-texas-drawl-edition-2026-11-08.mp3 audio/watchdog-2026-11-08.mp3
      - name: Commit rename
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Rename Nov 8 narration to audio/watchdog-2026-11-08.mp3"
          git push
