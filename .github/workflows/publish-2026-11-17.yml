name: Publish Watchdog Nov 17 2026

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Watchdog Nov 17 2026
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f watchdog-news-november-17-texas-drawl-edition-2026-11-17.mp3 audio/watchdog-2026-11-17.mp3
          git mv -f watchdog.html index.html
          git commit -m "Publish Watchdog Nov 17 2026"
          git push
