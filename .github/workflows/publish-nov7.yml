name: Publish Nov 7 Watchdog edition

on:
  push:
    paths:
      - '.github/workflows/publish-nov7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Nov 7 edition
        run: |
          git mv -f watchdog.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish November 7, 2026 Watchdog edition"
          git push
