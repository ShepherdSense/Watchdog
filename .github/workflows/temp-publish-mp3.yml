name: Temp Publish MP3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and publish MP3
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'gh release download temp-20261126-mp3 --pattern watchdog-2026-11-26.mp3 --dir /tmp && echo "ff541f7f4087c7efab9b4a80583ab06e  /tmp/watchdog-2026-11-26.mp3" | md5sum -c - && mkdir -p audio && cp /tmp/watchdog-2026-11-26.mp3 audio/watchdog-2026-11-26.mp3 && git config user.name "ShepherdSense" && git config user.email "shepherdsense@users.noreply.github.com" && git add audio/watchdog-2026-11-26.mp3 && git commit -m "Publish audio for November 26, 2026" && git push'
