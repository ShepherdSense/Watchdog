name: Publish Watchdog 2026-11-10

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move watchdog.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f watchdog.html ]; then
            echo "watchdog.html not found, nothing to do"
            exit 0
          fi
          git mv -f watchdog.html index.html
          git commit -m "Publish Watchdog November 10, 2026 edition"
          git push
