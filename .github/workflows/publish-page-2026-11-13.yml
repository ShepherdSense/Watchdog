name: Publish page 2026-11-13
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-page-2026-11-13.yml
      - watchdog.html
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename page into place
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          if [ -f watchdog.html ]; then
            git mv -f watchdog.html index.html
            git commit -m "Publish Watchdog Nov 13 2026 edition"
            git push
          else
            echo "watchdog.html not present; nothing to rename."
          fi
