name: Publish Watchdog player

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename watchdog.html to index.html
        run: 'git mv -f watchdog.html index.html || git mv -f watchdog.html index.html; git config user.name "ShepherdSense"; git config user.email "shepherdsense@users.noreply.github.com"; git commit -m "Watchdog player buttons update" ; git push'
