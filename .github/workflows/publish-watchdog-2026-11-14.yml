name: Publish Watchdog Nov 14 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rename audio and publish page
        run: |
          git config user.name ShepherdSense
          git config user.email shepherdsense@users.noreply.github.com
          git mv audio/watchdog-news-november-14-2026-texas-drawl-edition-2026-11-14.mp3 audio/watchdog-2026-11-14.mp3
          git mv -f watchdog.html index.html
          git commit -m "Publish Watchdog Nov 14 2026 edition"
          git push
