name: Publish November 3, 2026 Watchdog edition

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap temp file over index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f watchdog.html index.html
          git commit -m "Publish November 3, 2026 Watchdog edition"
          git push origin main
