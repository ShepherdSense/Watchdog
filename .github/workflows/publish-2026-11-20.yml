name: Publish Nov 20, 2026 edition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2026-11-20.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Nov 20 files into place
        run: |
          git mv -f watchdog.html index.html
          git mv -f audio/watchdog-news-november-20-2026-texas-drawl-edition-2026-11-20.mp3 audio/watchdog-2026-11-20.mp3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Watchdog November 20, 2026 edition"
          git push
