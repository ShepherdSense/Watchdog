name: Publish Watchdog Nov 24
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git mv -f audio/watchdog-news-november-24-2026-texas-drawl-edition-2026-11-24.mp3 audio/watchdog-2026-11-24.mp3 && git mv -f watchdog.html index.html && git config user.name "ShepherdSense" && git config user.email "shepherdsense@users.noreply.github.com" && git commit -m "Watchdog November 24, 2026 edition" && git push'
