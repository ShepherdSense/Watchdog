name: Publish Watchdog Nov 22
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Move edition into place'
        run: 'git mv -f audio/watchdog-news-november-22-2026-texas-drawl-edition-2026-11-22.mp3 audio/watchdog-2026-11-22.mp3; git mv -f watchdog.html index.html; git config user.name "ShepherdSense"; git config user.email "shepherdsense@users.noreply.github.com"; git commit -m "Watchdog Nov 22 edition"; git push'
