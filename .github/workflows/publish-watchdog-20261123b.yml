name: Publish Watchdog November 23 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move watchdog.html to index.html
        run: git mv -f watchdog.html index.html
      - name: Commit the rename
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Publish updated November 23 page as index.html"
          git push
