name: Publish Nov 2 Watchdog edition
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Swap temp file over index.html
        run: |
          git mv -f watchdog.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish November 2, 2026 Watchdog edition"
          git push
