name: Publish audio 2026-11-13
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-audio-2026-11-13.yml
      - audio/watchdog-news-november-13-2026-texas-drawl-edition-2026-11-13.mp3
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename audio into place
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          if [ -f audio/watchdog-news-november-13-2026-texas-drawl-edition-2026-11-13.mp3 ]; then
            git mv -f audio/watchdog-news-november-13-2026-texas-drawl-edition-2026-11-13.mp3 audio/watchdog-2026-11-13.mp3
            git commit -m "Publish Nov 13, 2026 Watchdog audio as audio/watchdog-2026-11-13.mp3"
            git push
          else
            echo "Source audio file not present; nothing to rename."
          fi
