name: Temp Publish Page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp page to index
        run: 'echo "d8ebbe76bce23ffe5cf9b66b216fd092  watchdog.html" | md5sum -c - && git config user.name "ShepherdSense" && git config user.email "shepherdsense@users.noreply.github.com" && git mv -f watchdog.html index.html && git commit -m "Publish daily edition November 26, 2026" && git push'
