name: Replace index with November 1 edition
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git mv -f shepherdsint.html index.html
          git commit -m "November 1, 2026 edition"
          git push
